name = "cvtl-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# ⚠️⚠️ CÔNG TẮC PHÂN QUYỀN THEO KHU VỰC (thêm 26/08/2026 — bước 4)
#   "0" = CHẾ ĐỘ BÓNG TỐI. Luật chạy đầy đủ nhưng KHÔNG chặn ai; mỗi lời gọi
#         lẽ ra bị chặn chỉ ghi một dòng nhật ký loai='bong_toi'.
#   "1" = CHẶN THẬT.
# Cách bật: sửa "0" -> "1" ở đây rồi commit (Cloudflare tự dựng lại), HOẶC
# đổi biến trên Dashboard — nhưng ĐỔI TRÊN DASHBOARD MÀ KHÔNG SỬA FILE NÀY
# thì lần đẩy code kế tiếp sẽ XOÁ MẤT (Cạm bẫy #1). An toàn nhất: sửa ở đây.
# ⚠️ ĐỪNG bật "1" khi chưa đọc nhật ký bóng tối ít nhất 1 tuần — chặn nhầm
# nghĩa là khu vực trưởng không nhập được số của CHÍNH MÌNH.
[vars]
PHAN_QUYEN_THAT = "0"

[[d1_databases]]
binding = "DB"
database_name = "cvtl-db"
database_id = "74e2ab5b-b246-497b-b706-be58d3015493"

# Tự chạy phép kiểm tra sức khoẻ dữ liệu mỗi đêm (mới 20/08/2026, xem
# src/handlers/kiem-tra-suc-khoe.js + hàm `scheduled` trong src/index.js).
# "0 23 * * *" = 23:00 UTC = 06:00 giờ Việt Nam (UTC+7) mỗi ngày.
[triggers]
crons = ["0 23 * * *"]

# ⚠️⚠️ BẮT BUỘC PHẢI KHAI BÁO Ở ĐÂY (thêm 24/08/2026) — ĐỪNG XOÁ.
# Bật nhật ký lỗi bằng tay trên Dashboard là KHÔNG ĐỦ: y hệt "Cạm bẫy #1"
# của biến môi trường loại Text, thứ gì không có trong file này sẽ bị coi là
# không tồn tại và bị XOÁ ở lần đẩy code kế tiếp. Chính Cloudflare cũng cảnh
# báo "Update your Wrangler config to ensure settings are consistent across
# deployments" ngay lúc bật.
#
# Có nhật ký thì lần sau ai báo lỗi là tra được ĐÚNG câu lệnh nào chết, lúc
# mấy giờ, của ai — thay vì phải suy đoán như sự cố sáng 24/08/2026.
# Gói miễn phí cho 200.000 sự kiện/ngày; hệ thống này dùng khoảng 500/ngày.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1
